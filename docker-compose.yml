services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/alexanderheffernan/stokes-valley-tennis-club:latest}
    container_name: stokes-valley-tennis-club
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3100}:3000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
